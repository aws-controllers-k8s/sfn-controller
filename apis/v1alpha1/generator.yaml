ignore:
  resource_names: []
  field_paths:
  - CreateStateMachineInput.EncryptionConfiguration
  - CreateActivityInput.EncryptionConfiguration
  - CreateStateMachineInput.VersionDescription

resources:
  StateMachine:
    fields:
      Definition:
        is_document: true
      # DescribeStateMachine always reports a logging configuration, level OFF by default.
      LoggingConfiguration:
        late_initialize:
          skip_incomplete_check: {}
      LoggingConfiguration.IncludeExecutionData:
        late_initialize:
          skip_incomplete_check: {}
      LoggingConfiguration.Level:
        late_initialize:
          skip_incomplete_check: {}
      Name:
        is_immutable: true
      Publish:
        compare:
          is_ignored: true
      RevisionId:
        is_read_only: true
        from:
          operation: DescribeStateMachine
          path: RevisionId
      RoleARN:
        references:
          service_name: iam
          resource: Role
          path: Status.ACKResourceMetadata.ARN
      Tags:
        compare:
          is_ignored: True
      # Likewise a tracing configuration, disabled by default, and a type, STANDARD by default.
      TracingConfiguration:
        late_initialize:
          skip_incomplete_check: {}
      TracingConfiguration.Enabled:
        late_initialize:
          skip_incomplete_check: {}
      Type:
        late_initialize:
          skip_incomplete_check: {}
    exceptions:
      errors:
        404:
          code: StateMachineDoesNotExist
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_read_one_post_set_output:
        template_path: hooks/statemachine/sdk_read_one_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdateStateMachine
  Activity:
    exceptions:
      errors:
        404:
          code: ActivityDoesNotExist
    fields:
      Name:
        is_immutable: true
      Tags:
        compare:
          is_ignored: True
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_read_one_post_set_output:
        template_path: hooks/activity/sdk_read_one_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdateActivity
  StateMachineAlias:
    fields:
      Name:
        is_immutable: true
    tags:
      ignore: true
    exceptions:
      errors:
        404:
          code: ResourceNotFound
